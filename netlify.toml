[build]
  publish = "."

# The contact page has been removed — send any remaining links to the home page.
[[redirects]]
  from = "/contact"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/contact/*"
  to = "/"
  status = 301
  force = true

# Old single-page routes, in case anything linked them without the hash.
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/episodes.html"
  to = "/episodes/"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/about/"
  status = 301

# Friendly aliases for the Take Part page.
[[redirects]]
  from = "/get-involved"
  to = "/take-part/"
  status = 301

[[redirects]]
  from = "/take-part.html"
  to = "/take-part/"
  status = 301

# Friendly aliases for the R.I.S.E Music page.
[[redirects]]
  from = "/music"
  to = "/rise-music/"
  status = 301

[[redirects]]
  from = "/rise-music.html"
  to = "/rise-music/"
  status = 301

  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/episodes.html"
  to = "/episodes/"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/about/"
  status = 301

# Friendly aliases for the Take Part page.
